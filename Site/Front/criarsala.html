<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>CodeChamp</title>
    <link rel="stylesheet" href="stylecriarsala.css">
</head>

<body>

    <header>
        <div class="logo">
            <div class="logo-icon"><img src="logotrofeu.png" alt="logo"></div>
            <div>
                <span class="logo-text">CodeChamp</span>
                <span class="logo-sub">Aprenda Programação com Desafios</span>
            </div>
        </div>
        <div class="header-icons">
          <button class="icon-btn"><a href="aula.html">👩‍🏫</a></button>
          <button class="icon-btn"><a href="loja.html">🛒</a></button>
          <button class="icon-btn"><a href="conquista.html">🏅</a></button>
          <button class="icon-btn"><a href="ranking.html">🏆</a></button>
          <!-- <button class="icon-btn"><a href="">⚙️</a></button> -->
          <button class="icon-btn"><a href="perfil.html">👤</a></button>
            <button class="icon-btn"><a href="home.html">🔙</a></button>
        </div>
    </header>

    <main>

        <h1 class="page-title">CRIAR SALA</h1>
        <section class="modes-grid">
            <div class="mode-card">
                <div class="mode-title">⚡ Modo Speed</div>
                <span class="mode-icon">⏱️</span>
                <div class="mode-desc">Desafios Rápidos</div>
                <div class="mode-sub">Quem acerta primeiro!</div>
            </div>
            <div class="mode-card active">
                <div class="mode-title">🧠 Modo Maratona</div>
                <span class="mode-icon">🧠</span>
                <div class="mode-desc">Desafios Longos</div>
                <div class="mode-sub">Resolva o grande problema!</div>
            </div>
            <div class="mode-card">
                <div class="mode-title">⚔️ Batalha 1×1</div>
                <div class="vs-row">
                    <div class="avatar">😎</div>
                    <span class="vs-label">VS</span>
                    <div class="avatar">🎮</div>
                </div>
                <div class="mode-desc">Duelo direto 1 × 1</div>
                <div class="mode-sub">Quem vence?</div>
            </div>
        </section>

        <div class="config-panel">
            <div class="config-grid">

                <div class="config-row">
                    <span class="config-label">👥 Número de Jogadores</span>
                    <div class="toggle-wrap">
                        <label class="toggle">
                            <input type="checkbox" id="togglePlayers">
                            <div class="toggle-track"></div>
                            <div class="toggle-thumb"></div>
                        </label>
                        <span class="toggle-val" id="players-val">—</span>
                    </div>
                </div>

                <div class="config-row">
                    <span class="config-label">⏱️ Tempo de Partida</span>
                    <div class="toggle-wrap">
                        <label class="toggle">
                            <input type="checkbox" id="toggleTime">
                            <div class="toggle-track"></div>
                            <div class="toggle-thumb"></div>
                        </label>
                        <span class="toggle-val" id="time-val">—</span>
                    </div>
                </div>

            </div>

            <hr class="divider">
            <div class="password-row">
                <span class="field-label">🔒 Senha da Sala (opcional)</span>
                <input class="field-input" type="password" placeholder="Deixe em branco para sala pública"
                    id="roomPassword">
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary"><a href="home.html">❌ Cancelar</a></button>
            <button class="btn btn-primary"><a href="sala.html">Criar Sala</a> </button>
        </div>

    </main>

</body>

</html>
