<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeChamp</title>
    <link rel="stylesheet" href="styleloja.css">

</head>

<body>

    <header>
        <div class="logo">
            <div class="logo-icon"><img src="logotrofeu.png" alt="logo"></div>
            <div>
                <div class="logo-text">CodeChamp</div>
                <div class="logo-sub">Aprenda Programação com Desafios</div>
            </div>
        </div>
        <div class="header-icons">
          <button class="icon-btn"><a href="aula.html">👩‍🏫</a></button>
          <button class="icon-btn"><a href="loja.html">🛒</a></button>
          <button class="icon-btn"><a href="conquista.html">🏅</a></button>
          <button class="icon-btn"><a href="ranking.html">🏆</a></button>
          <!-- <button class="icon-btn"><a href="">⚙️</a></button> -->
          <button class="icon-btn"><a href="perfil.html">👤</a></button>
            <button class="icon-btn"><a href="home.html">🔙</a></button>
        </div>
    </header>

    <div style="background:linear-gradient(180deg,#1A0030,#000);border-bottom:1px solid #2a004466;padding:14px 40px;">
        <div style="max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;">
            <div class="page-title">🛒 LOJA</div>
            <div class="coin-display">🪙 <span id="coins">3.450</span> coins</div>
        </div>
    </div>

    <main>
        <div class="tabs">
            <button class="tab active" onclick="setTab('avatares', this)">🧑 Avatares</button>
            <button class="tab" onclick="setTab('molduras', this)">🖼️ Molduras</button>
            <button class="tab" onclick="setTab('temas', this)">🎨 Temas</button>
            <button class="tab" onclick="setTab('power', this)">⚡ Power-Ups</button>
        </div>

        <div class="items-grid" id="itemsGrid"></div>
    </main>

    <!-- MODAL COMPRA -->
    <div class="modal oculto" id="buyModal">
        <div class="modal-box">
            <div class="modal-icon" id="mIcon">🦊</div>
            <div class="modal-title" id="mTitle">Item</div>
            <div class="modal-desc" id="mDesc">Descrição do item</div>
            <div class="modal-price" id="mPrice">🪙 500</div>
            <div class="modal-btns">
                <button class="modal-btn cancel" onclick="closeModal()">Cancelar</button>
                <button class="modal-btn confirm" onclick="confirmBuy()">Comprar</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">✅ Item comprado com sucesso!</div>

    <script>
        const catalog = {
            avatares: [
                { id: 'av1', icon: '🦊', name: 'Raposa Hacker', desc: 'Avatar exclusivo para programadores noturnos', price: 500, owned: false, badge: 'hot' },
                { id: 'av2', icon: '🐉', name: 'Dragão Code', desc: 'Poder e sabedoria em cada linha de código', price: 800, owned: false, badge: 'rare' },
                { id: 'av3', icon: '🤖', name: 'Robô Dev', desc: 'Automatize seu estilo com esse avatar', price: 350, owned: true, badge: 'owned' },
                { id: 'av4', icon: '🧙', name: 'Mago do Bug', desc: 'Faz bugs desaparecerem com um feitiço', price: 650, owned: false, badge: 'new' },
                { id: 'av5', icon: '👾', name: 'Alien Pixel', desc: 'Vindo de uma galáxia cheia de código', price: 0, owned: false, badge: null },
                { id: 'av6', icon: '🦁', name: 'Leão Fullstack', desc: 'Domina front, back e tudo mais', price: 1200, owned: false, badge: 'rare' },
            ],
            molduras: [
                { id: 'm1', icon: '⭐', name: 'Moldura Ouro', desc: 'Para quem chegou ao topo do ranking', price: 600, owned: false, badge: 'hot' },
                { id: 'm2', icon: '🔮', name: 'Moldura Cristal', desc: 'Brilho sobrenatural no seu perfil', price: 900, owned: false, badge: 'rare' },
                { id: 'm3', icon: '🔥', name: 'Moldura Chamas', desc: 'Seu perfil em chamas de habilidade', price: 400, owned: true, badge: 'owned' },
                { id: 'm4', icon: '❄️', name: 'Moldura Gelo', desc: 'Frieza e precisão em cada desafio', price: 400, owned: false, badge: 'new' },
            ],
            temas: [
                { id: 't1', icon: '🌌', name: 'Tema Nebulosa', desc: 'Interface com cores do universo', price: 1000, owned: false, badge: 'rare' },
                { id: 't2', icon: '🌿', name: 'Tema Matrix', desc: 'Verde e escuro, estilo terminal clássico', price: 700, owned: false, badge: 'hot' },
                { id: 't3', icon: '🌅', name: 'Tema Aurora', desc: 'Gradientes vibrantes e modernos', price: 800, owned: false, badge: 'new' },
                { id: 't4', icon: '🖤', name: 'Tema Dark Pro', desc: 'O escuro definitivo para programar', price: 0, owned: false, badge: null },
            ],
            power: [
                { id: 'p1', icon: '⏩', name: 'Tempo Extra', desc: '+2 minutos em qualquer desafio', price: 200, owned: false, badge: 'hot' },
                { id: 'p2', icon: '💡', name: 'Dica de Código', desc: 'Revela uma dica no desafio atual', price: 150, owned: false, badge: null },
                { id: 'p3', icon: '🛡️', name: 'Escudo XP', desc: 'Protege seu XP por 24 horas', price: 1100, owned: false, badge: 'new' },
                { id: 'p4', icon: '🚀', name: 'XP Dobrado', desc: 'Ganha 2x XP por 1 hora', price: 500, owned: false, badge: 'rare' },
            ]
        };

        let currentTab = 'avatares';
        let pendingItem = null;
        let coins = 3450;

        function setTab(tab, el) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = '';
            catalog[currentTab].forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card' + (item.owned ? ' owned' : '') + (item.badge === 'rare' ? ' featured' : '');
                const badgeHtml = item.badge && item.badge !== 'owned'
                    ? `<div class="item-badge badge-${item.badge}">${item.badge === 'new' ? '✨ NOVO' : item.badge === 'hot' ? '🔥 POPULAR' : '💎 RARO'}</div>`
                    : item.owned ? `<div class="item-badge badge-owned">✅ SEU</div>` : '';
                const priceHtml = item.price === 0
                    ? `<span class="item-price free">GRÁTIS</span>`
                    : `<span class="item-price">🪙 ${item.price}</span>`;
                const btnHtml = item.owned
                    ? `<button class="buy-btn owned-btn">✅ Equipado</button>`
                    : item.price === 0
                        ? `<button class="buy-btn free-btn" onclick="openModal('${item.id}')">Resgatar</button>`
                        : `<button class="buy-btn gold" onclick="openModal('${item.id}')">Comprar</button>`;
                card.innerHTML = `
        ${badgeHtml}
        <div class="item-preview">${item.icon}</div>
        <div class="item-info">
          <div class="item-name">${item.name}</div>
          <div class="item-desc">${item.desc}</div>
          <div class="item-footer">${priceHtml}${btnHtml}</div>
        </div>`;
                grid.appendChild(card);
            });
        }

        function openModal(id) {
            const all = Object.values(catalog).flat();
            pendingItem = all.find(i => i.id === id);
            document.getElementById('mIcon').textContent = pendingItem.icon;
            document.getElementById('mTitle').textContent = pendingItem.name;
            document.getElementById('mDesc').textContent = pendingItem.desc;
            document.getElementById('mPrice').textContent = pendingItem.price === 0 ? '🎁 GRÁTIS' : `🪙 ${pendingItem.price} coins`;
            document.getElementById('buyModal').classList.remove('oculto');
        }

        function closeModal() {
            document.getElementById('buyModal').classList.add('oculto');
            pendingItem = null;
        }

        function confirmBuy() {
            if (!pendingItem) return;
            if (pendingItem.price > 0 && coins < pendingItem.price) {
                alert('Coins insuficientes!'); closeModal(); return;
            }
            coins -= pendingItem.price;
            document.getElementById('coins').textContent = coins.toLocaleString('pt-BR');
            pendingItem.owned = true;
            closeModal();
            renderGrid();
            const toast = document.getElementById('toast');
            toast.textContent = `✅ ${pendingItem.name} adquirido!`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2800);
        }

        renderGrid();
    </script>
</body>

</html>
