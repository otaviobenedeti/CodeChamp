<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>CodeChamp</title>
  <link rel="stylesheet" href="ranking.css">
</head>

<body>

  <header>
    <div class="logo">
      <div class="logo-icon"><img src="logotrofeu.png" alt="logo"></div>
      <div>
        <span class="logo-text">CodeChamp</span>
        <span class="logo-sub">Aprenda Programação com Desafios</span>
      </div>
    </div>
    <div class="header-icons">
          <button class="icon-btn"><a href="aula.html">👩‍🏫</a></button>

          <button class="icon-btn"><a href="conquista.html">🏅</a></button>

  <main>

    <div class="page-title">🏆 Ranking 🏆</div>
    <div class="ranking-table">
      <div class="table-header">
        <div class="th">Classificação</div>
        <div class="th">Jogador</div>
        <div class="th right">Pontos</div>
      </div>
      <div class="rank-row">
        <div class="pos-cell">
          <div class="medal medal-1">1º</div>
        </div>
        <div class="player-cell">
          <div class="player-avatar">😎</div>
          <div>
            <div class="player-name">miguel_gerbi</div>
            <div class="player-tag">Competidor</div>
          </div>
        </div>
        <div class="score-cell">
          <div class="score-bar-wrap">
            <div class="score-bar" style="width:120px"></div>
            <span class="score-val">754</span>
          </div>
        </div>
      </div>
      <div class="rank-row">
        <div class="pos-cell">
          <div class="medal medal-2">2º</div>
        </div>
        <div class="player-cell">
          <div class="player-avatar">🎮</div>
          <div>
            <div class="player-name">otavio_benedeti</div>
            <div class="player-tag">Competidor</div>
          </div>
        </div>
        <div class="score-cell">
          <div class="score-bar-wrap">
            <div class="score-bar" style="width:108px"></div>
            <span class="score-val">679</span>
          </div>
        </div>
      </div>
      <div class="rank-row">
        <div class="pos-cell">
          <div class="medal medal-3">3º</div>
        </div>
        <div class="player-cell">
          <div class="player-avatar">🦁</div>
          <div>
            <div class="player-name">italo_mozer</div>
            <div class="player-tag">Competidor</div>
          </div>
        </div>
        <div class="score-cell">
          <div class="score-bar-wrap">
            <div class="score-bar" style="width:86px"></div>
            <span class="score-val">542</span>
          </div>
        </div>
      </div>
      <div class="rank-row">
        <div class="pos-cell">
          <div class="medal medal-n">4º</div>
        </div>
        <div class="player-cell">
          <div class="player-avatar">👽</div>
          <div>
            <div class="player-name">luis_pereira</div>
            <div class="player-tag">Competidor</div>

          <div class="score-bar-wrap">
            <div class="score-bar" style="width:37px"></div>
            <span class="score-val">435</span>
          </div>
        </div>
      </div>

    </div>
