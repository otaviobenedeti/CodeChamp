<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>CodeChamp</title>
    <link rel="stylesheet" href="stylesala.css">
</head>

<body>

    <header>
        <div class="logo">
            <div class="logo-icon"><img src="logotrofeu.png" alt="logo"></div>
            <div>
                <div class="logo-text">CodeChamp</div>
                <div class="logo-sub">Aprenda Programação com Desafios</div>
            </div>
        </div>
        <div class="header-icons">
          <button class="icon-btn"><a href="aula.html">👩‍🏫</a></button>
          <button class="icon-btn"><a href="loja.html">🛒</a></button>
          <button class="icon-btn"><a href="conquista.html">🏅</a></button>
          <button class="icon-btn"><a href="ranking.html">🏆</a></button>
          <!-- <button class="icon-btn"><a href="">⚙️</a></button> -->
          <button class="icon-btn"><a href="perfil.html">👤</a></button>
            <button class="icon-btn"><a href="home.html">🔙</a></button>
        </div>
    </header>
    <main>
        <div class="participantes-painel">

            <div class="painel-header">
                <span class="painel-title">Participantes</span>
                <span class="player-count">5</span>
            </div>

            <div class="player-list">

                <div class="player-item admin">
                    <div class="p-avatar">👑</div>
                    <div class="p-info">
                        <div class="p-name">Robson_souza</div>
                        <div class="p-role">Administrador</div>
                    </div>
                    <div class="p-icon">👑</div>
                </div>

                <div class="player-item">
                    <div class="p-avatar">🎮</div>
                    <div class="p-info">
                        <div class="p-name">otavio_benedeti</div>
                        <div class="p-role">Competidor</div>
                    </div>
                    <div class="p-icon">👤</div>
                </div>

                <div class="player-item">
                    <div class="p-avatar">🦁</div>
                    <div class="p-info">
                        <div class="p-name">italo_mozer</div>
                        <div class="p-role">Competidor</div>
                    </div>
                    <div class="p-icon">👤</div>
                </div>

                <div class="player-item">
                    <div class="p-avatar">👽</div>
                    <div class="p-info">
                        <div class="p-name">luis_pereira</div>
                        <div class="p-role">Competidor</div>
                    </div>
                    <div class="p-icon">👤</div>
                </div>

                <div class="player-item">
                    <div class="p-avatar">😎</div>
                    <div class="p-info">
                        <div class="p-name">miguel_gerbi</div>
                        <div class="p-role">Competidor</div>
                    </div>
                    <div class="p-icon">👤</div>
                </div>

            </div>
        </div>

        <div class="room-area">
            <div class="room-header">
                <div>
                    <div class="room-name">SESI 3ºA</div>
                    <div class="room-code">Código da sala: <span>SENAI</span></div>
                </div>
                <div class="status-badge status-waiting">⏳ Aguardando jogadores</div>
            </div>

            <div class="room-actions">
                <button class="btn btn-leave"><a href="home.html"> Sair da Sala</a></button>
                <button class="btn btn-ready">✅ Pronto</button>
                <button class="btn btn-start"><a href="desafio.html">Iniciar Partida</a></button>
            </div>

        </div>

    </main>
</body>

</html>
